name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK using official Kivy Buildozer Docker image
        run: |
          docker run --rm -v "$(pwd)":/home/user/hostcwd kivy/buildozer:latest android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digivaani-phone-doctor-apk
          path: bin/*.apk
