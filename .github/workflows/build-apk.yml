[app]

title = DigiVaani Phone Doctor
package.name = digivaanphonedoctor
package.domain = org.digivaani64

source.dir = .
source.include_exts = py,png,jpg,kv,atlas

version = 1.0

requirements = python3==3.11.9,kivy,plyer,psutil

orientation = portrait
fullscreen = 0

# (str) Presplash background color (for android toolchain)
android.presplash_color = #0A0E2A

# Android permissions needed for storage scanning
android.permissions = READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE

# Target API / min API — adjust to current recommended values as needed
android.api = 33
android.minapi = 24
android.ndk = 25b

android.archs = arm64-v8a, armeabi-v7a

[buildozer]
log_level = 2
warn_on_root = 1
