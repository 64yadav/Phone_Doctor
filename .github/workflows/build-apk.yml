name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            -e CFLAGS="-D_XOPEN_SOURCE=700" \
            -e CPPFLAGS="-D_XOPEN_SOURCE=700" \
            kivy/buildozer:latest \
            android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digivaani-phone-doctor-apk
          path: bin/*.apk
          if-no-files-found: error
